<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Vereinskasse</title>
  <meta name="description" content="Einfache Kasse für Vereinsfeste – läuft offline.">
  <meta name="theme-color" content="#00696E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vereinskasse">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #fffbfe;
      font-family: -apple-system, system-ui, sans-serif; color: #1c1b1f; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
    #laden { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px; background: inherit; }
    #laden img { width: 96px; height: 96px; border-radius: 22px; }
    @media (prefers-color-scheme: dark) { html, body { background: #1c1b1f; color: #e6e1e5; } }
  </style>
  <script src="vk.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="laden">
    <img src="icon-192.png" alt="">
    <div id="ladetext">Vereinskasse wird geladen …</div>
  </div>
  <script>
    // Prüfen, ob der Browser WebAssembly mit Garbage Collection kann (Safari ab iOS 18.2)
    var wasmGc = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
    if (typeof WebAssembly === 'object' && WebAssembly.validate(wasmGc)) {
      var s = document.createElement('script');
      s.src = 'vereinskasse.js';
      document.head.appendChild(s);
    } else {
      document.getElementById('ladetext').innerHTML =
        'Dieser Browser ist zu alt für die Vereinskasse.<br>Bitte iOS 18.2 oder neuer bzw. einen aktuellen Chrome, Firefox oder Safari verwenden.';
    }
  </script>
</body>
</html>
