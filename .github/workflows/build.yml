name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt – die APK wird mit einem wechselnden Test-Schlüssel signiert. Updates erfordern dann eine Neuinstallation (siehe README)."
          fi

      - name: Tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "Vereinskasse-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Vereinskasse-1.0.${{ github.run_number }}
          path: Vereinskasse-*.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Vereinskasse-*.apk \
            --title "Vereinskasse 1.0.${{ github.run_number }}" \
            --notes "APK herunterladen und auf dem Android-Handy installieren. Änderung: ${{ github.event.head_commit.message || 'manueller Build' }}"

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Web-App bauen
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          YARN_HERUNTERLADEN: "1"
        run: ./gradlew :composeApp:webApp

      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      - name: Auf GitHub Pages veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4
